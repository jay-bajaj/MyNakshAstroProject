[project]
name = "mynaksh"
version = "0.1.0"
description = "A modular astrology chat API scaffold"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "langchain-core>=1.6.10",
    "langchain-google-genai>=4.4.2",
    "langchain-openai>=1.7.2",
    "langgraph>=0.2,<2.0",
    "neo4j>=5.25,<7.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
